media:
  input: public/uploads
  output: /uploads

content:
  - name: study-content
    label: Study Content
    type: collection
    path: content
    filename: "{primary}.md"
    view:
      fields: [title, category, subcategory]
      primary: title
      sort: [title]
      default:
        sort: title
        order: asc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: seo_title
        label: SEO Title
        type: string
        description: "Recommended: about 50–60 characters."
        required: true
      - name: meta_description
        label: Meta Description
        type: text
        description: "Recommended: about 140–160 characters."
        required: true
      - name: category
        label: Category
        type: select
        required: true
        options:
          values:
            - History
            - Geography
            - Economics
            - Indian Constitution
            - Kerala Governance & Administration
            - Life Science
            - Physics
            - Chemistry
            - Arts, Literature, Culture & Sports
            - Computer
            - Education Policies, Acts & Commissions
            - Current Affairs
            - Arithmetic & Reasoning
            - English
            - Regional Language
      - name: subcategory
        label: Subcategory
        type: select
        description: "Use only for History, Geography and Economics."
        options:
          values:
            - Kerala History
            - Indian History
            - World History
            - Kerala Geography
            - Indian Geography
            - World & General Geography
            - Economic Concepts
            - Indian Economy
            - Kerala Economy
